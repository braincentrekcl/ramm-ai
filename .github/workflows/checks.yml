name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install car for the lm() test
        run: |
          Rscript -e "install.packages('car', repos = 'https://packagemanager.posit.co/cran/__linux__/$(lsb_release -cs)/2025-01-15')"
          Rscript -e "stopifnot(requireNamespace('car', quietly = TRUE))"
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install Claude Code and Codex
        run: npm install -g @anthropic-ai/claude-code@2.1.277 @openai/codex@0.160.1
      - name: Validate the Claude Code plugin
        run: claude plugin validate --strict .
      - name: Check Codex sees both skills
        run: bash tests/codex_probe.sh
      - name: Repository checks
        run: uv run --with pytest pytest tests -v
