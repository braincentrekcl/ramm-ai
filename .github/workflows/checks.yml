name: checks

# One run per change: pull requests, and pushes to main once merged.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-image.yml

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Claude Code, Codex, GitHub Copilot CLI and OpenCode
        run: npm install -g @anthropic-ai/claude-code@2.1.277 @openai/codex@0.160.1 @github/copilot@1.0.93 @opencode/cli@2.0.24
      - name: Validate the Claude Code plugin
        run: claude plugin validate --strict .
      - name: Check Codex sees both skills
        run: bash tests/codex_probe.sh
      - name: Check Copilot installs both skills
        run: bash tests/copilot_probe.sh
      - name: Check OpenCode loads every template rule and both skills
        run: bash tests/opencode_probe.sh

  # The repository checks run in the image from ci-image.yml, which has R and
  # every package the R chunk tests load, so a missing package fails a test
  # instead of skipping it.
  tests:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      RAMM_AI_REQUIRE_R_PACKAGES: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Repository checks
        run: uv run --with pytest pytest tests -v
