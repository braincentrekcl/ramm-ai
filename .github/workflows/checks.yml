name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install car for the lm() test
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::car
      - name: Check car is installed, so the lm() test is not skipped
        run: Rscript -e "stopifnot(requireNamespace('car', quietly = TRUE))"
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install Claude Code, Codex, GitHub Copilot CLI and OpenCode
        run: npm install -g @anthropic-ai/claude-code@2.1.277 @openai/codex@0.160.1 @github/copilot@1.0.93 @opencode/cli@2.0.24
      - name: Validate the Claude Code plugin
        run: claude plugin validate --strict .
      - name: Check Codex sees both skills
        run: bash tests/codex_probe.sh
      - name: Check Copilot installs both skills
        run: bash tests/copilot_probe.sh
      - name: Check OpenCode loads every template rule and both skills
        run: bash tests/opencode_probe.sh
      - name: Repository checks
        run: uv run --with pytest pytest tests -v
